# CI: typecheck + tests + build for the app, shellcheck + harness for the infra scripts.
# No secrets, no deploy. Green here means main is buildable and the scripts parse.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on PR branches, never on main: GitHub renders a
# cancelled run as failing, so rapid merges were flipping the README badge
# to FAILING while main was healthy. Main runs are few and cheap, let each
# one finish and keep the badge truthful.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 23 is a floor, not a preference: `npm test` runs .ts files through
          # `node --test` and needs native type stripping. Don't drop to 22 LTS
          # without also changing the test script (that's SDE-App's file).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Was a no-op before #73: no eslint dep and no config, so it dropped into
      # Next's interactive setup prompt and could never have run here.
      - run: npm run lint
      - run: npm test
      # `npm run dev` can't bundle the node: import in src/lib/zcash/t2z.ts,
      # so a real build is the only signal that the app actually ships.
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    env:
      # Real ZalletSender against the fake-zallet double (#68): the path under
      # test is production code, only the wallet RPC boundary is faked.
      FAUCET_SENDER: zallet
      ZALLET_RPC_URL: http://127.0.0.1:28299/
      ZALLET_ACCOUNT: fake-account
      ZALLET_ADDRESS: utest1fake
      ZALLET_MIN_CONF: "0"
      ZALLET_POLL_MS: "250"
      FAUCET_CHALLENGE: pow
      FAUCET_POW_BITS: "16"
      RATE_LIMIT_SALT: ci-smoke-not-a-secret
      PORT: "3100"
      SMOKE_URL: http://localhost:3100
      # Point the tip oracle at a local fixture, same as the ui and api-tests
      # jobs. This job was green WITHOUT it only because the claim went through
      # POST /api/faucet, which consulted nothing: the oracle reached the live
      # dashboard, our node read ~570,000 blocks behind the wallet double's tip
      # of 3,650,000, and nothing on the drip path cared. #187 makes the drip
      # path care, so the environment has to stop lying to it (#171).
      HOSH_URL: http://127.0.0.1:28324/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The real claim flow over HTTP: status, signed pow challenge, solve,
      # claim -> txid, repeat -> 429, no pow -> 403. Integration coverage the
      # unit tests cannot give, and the cutover validation script.
      - name: e2e smoke
        run: |
          PORT=28299 node scripts/fake-zallet.mjs &
          double=$!
          # Before the app, not after. The first background tip refresh happens at
          # boot, and if the fixture is missing then, the oracle degrades to a
          # direct lightwalletd call and caches the REAL network tip for the rest
          # of the run. Starting it late narrows the race instead of removing it.
          PORT=28324 node scripts/fake-hosh.mjs &
          hosh=$!
          # Declared before the trap so the hard exit below still reaps the doubles.
          server=""
          trap 'kill "$server" "$double" "$hosh" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf "$HOSH_URL" >/dev/null && break
            sleep 1
          done
          curl -sf "$HOSH_URL" >/dev/null || { echo "tip-oracle fixture never came up"; exit 1; }
          npm start &
          server=$!
          for _ in $(seq 1 60); do
            curl -sf "$SMOKE_URL/api/status" >/dev/null && break
            sleep 1
          done
          npm run smoke

  ui:
    runs-on: ubuntu-latest
    env:
      # Same double-backed setup as the smoke job, see #68.
      FAUCET_SENDER: zallet
      ZALLET_RPC_URL: http://127.0.0.1:28299/
      ZALLET_ACCOUNT: fake-account
      ZALLET_ADDRESS: utest1fake
      ZALLET_MIN_CONF: "0"
      ZALLET_POLL_MS: "250"
      FAUCET_CHALLENGE: pow
      # Low bits so the in-page worker still runs but finishes fast.
      FAUCET_POW_BITS: "12"
      RATE_LIMIT_SALT: ci-ui-smoke-not-a-secret
      PORT: "3120"
      UI_SMOKE_URL: http://localhost:3120
      # Point the tip oracle at a local fixture instead of the live hosh
      # dashboard. Without this the app compares the wallet double's tip
      # (3,650,000) against the real network (past 4,220,000), decides our node is
      # ~570,000 blocks behind, marks it frozen and refuses the claim — so the
      # smoke test waits out its 120s timeout for a "Sent ✓" that can never
      # appear. Same root cause as the api-tests job (#171).
      HOSH_URL: http://127.0.0.1:28324/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # --no-save on purpose: Playwright is a CI-only concern, so it stays out
      # of package.json and `npm ci` stays lean for everyone else.
      #
      # Pinned exactly, because unpinned it resolved to whatever shipped that
      # morning: a browser release could turn this job red with no diff to
      # explain it. Dependabot cannot see a version that lives outside a
      # manifest, so bumping this is a manual step, deliberately.
      - name: install playwright chromium
        env:
          PLAYWRIGHT_VERSION: 1.62.0
        run: |
          npm i --no-save "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      # Drives a claim in a real browser: the page, the pow worker, the success
      # card and the copy path. Guarded so refs predating the script stay green.
      - name: browser smoke
        run: |
          if [ ! -f scripts/ui-smoke.mjs ]; then
            echo "no scripts/ui-smoke.mjs on this ref, skipping"
            exit 0
          fi
          PORT=28299 node scripts/fake-zallet.mjs &
          double=$!
          # The oracle fixture must be answering BEFORE the app starts. If the
          # app's first background tip refresh finds it missing, the oracle falls
          # back to a direct lightwalletd call, caches the real network tip, and
          # the run is frozen from then on — starting it late only narrows the race
          # rather than removing it.
          PORT=28324 node scripts/fake-hosh.mjs &
          hosh=$!
          # Declared before the trap so the early exit below still reaps the two
          # doubles rather than leaking them on a failure path.
          server=""
          trap 'kill "$server" "$double" "$hosh" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf "$HOSH_URL" >/dev/null && break
            sleep 1
          done
          curl -sf "$HOSH_URL" >/dev/null || { echo "tip-oracle fixture never came up"; exit 1; }
          npm start &
          server=$!
          for _ in $(seq 1 60); do
            curl -sf "$UI_SMOKE_URL/api/status" >/dev/null && break
            sleep 1
          done
          node scripts/ui-smoke.mjs

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Route-level integration suite (scripts/api-integration.mjs): boots the
      # built app in two configs and drives every API route. Guarded so refs
      # that predate the suite stay green.
      - name: api integration tests
        run: |
          if [ -f scripts/api-integration.mjs ]; then
            npm run test:api
          else
            echo "no scripts/api-integration.mjs on this ref, skipping"
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # High or critical advisories fail the build. Lows are visible in the
      # log but do not gate: for a hot-wallet faucet the bar is no known-bad
      # crypto or parser in the tree, not zero noise.
      - name: npm audit (fail on high)
        run: |
          npm audit || true
          npm audit --audit-level=high >/dev/null
      - name: cargo audit (fail on any advisory)
        run: |
          if [ -d deploy/z3/miner ]; then
            cargo install cargo-audit --locked
            cargo audit --file deploy/z3/miner/Cargo.lock
          else
            echo "no deploy/z3/miner on this ref, skipping"
          fi

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck deploy scripts
        run: shellcheck -S warning deploy/deploy.sh deploy/z3/*.sh
      - name: z3 test harness
        # run-tests.sh is the single entrypoint and runs every suite under
        # deploy/z3/tests/suites/ with one tally. Never glob the tests dir:
        # stubs/ and deploy-stubs/ hold fake zebrad/docker binaries the
        # suites put on PATH, not test files. Guarded so refs that predate
        # the harness stay green.
        run: |
          if [ -f deploy/z3/tests/run-tests.sh ]; then
            bash deploy/z3/tests/run-tests.sh
          else
            echo "no deploy/z3/tests/run-tests.sh on this ref, skipping"
          fi
      - name: cloud-init parses
        run: python3 -c 'import yaml; yaml.safe_load(open("deploy/cloud-init.yaml"))'

  miner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Guarded the same way as the harness suites: green before the miner
      # lands, active the moment it merges. Plain `cargo test` only, the
      # ignored solve test needs a release build and ~144MB, it stays a
      # local-run check (see MINING.md).
      - name: cargo test + clippy
        run: |
          if [ -d deploy/z3/miner ]; then
            cd deploy/z3/miner
            cargo test
            cargo clippy --all-targets -- -D warnings
          else
            echo "no deploy/z3/miner on this ref, skipping"
          fi
