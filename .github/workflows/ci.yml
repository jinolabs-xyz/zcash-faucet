# CI: typecheck + tests + build for the app, shellcheck + harness for the infra scripts.
# No secrets, no deploy. Green here means main is buildable and the scripts parse.
#
# EVERY JOB HAS A timeout-minutes. GitHub's default is six hours, and a hung `node --test`
# (a leaked listener after a failed assertion, #481) sat in that for a whole afternoon
# once. #490 fixed the leak we knew about; this is the second layer, so the next one costs
# minutes. Budgets are about three times the slowest run of the last eight on main
# (shell ~14 min, audit ~3.5, ui ~2.5, the rest under 2), rounded up to a 5. shell's is
# the one that grows: eleven of its minutes are three sleep-bound harness suites, and
# every suite added brings its own wait. A job that legitimately outgrows its budget
# should raise the number here with the measurement, not have the line removed: the
# repo suite asserts every job carries one, at the job level, as a positive literal.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# LEAST PRIVILEGE FOR THE JOB TOKEN (risk register #27). Nothing in this workflow
# writes through the GitHub API: no gh, no actions/github-script; the one action that
# takes the token (trivy-action, to fetch its own release) needs contents: read. Without a
# permissions block every job here ran with whatever the repository default grants,
# which on an older default is write to contents, issues, packages and more, handed
# to code from a pull request branch. Declared read-only at the top, and the repo suite
# refuses job-level permissions blocks and pull_request_target outright (risk register
# II, R-8): a job that later needs something widens THIS block and says why, the way
# live-smoke.yml's top-level actions:read does.
permissions:
  contents: read

# Cancel superseded runs on PR branches, never on main. The old group was the ref,
# and `cancel-in-progress: false` for main did not do what it says: GitHub still
# cancels the PENDING run in a group when a newer one queues, so rapid merges left
# four main commits (one of them a security fix) with a cancelled run and no jobs.
# Nothing could watch those runs to green, and now the box refuses to deploy a commit
# with no verdict, so a main run that never happens is a deploy that never happens.
# Per-commit groups on push: main runs never share a group, so none is superseded.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the Dockerfile (node:24-slim). Tests must run on the runtime we
          # ship: this was pinned to 23 while production ran 22, so every green
          # suite was green on a runtime that does not exist in production. The
          # repo suite now asserts the agreement.
          #
          # 24 is Active LTS until 2026-10-20 and supported until 2028-04-30; 22
          # has been Maintenance since 2025-10-21. 26 is Current until it becomes
          # LTS on 2026-10-28, and an unattended faucet does not want a Current
          # line, so revisit then.
          #
          # The floor for `npm test` is 22.18: it runs .ts through `node --test`,
          # which needs type stripping, unflagged from 22.18. Below that the script
          # needs --experimental-strip-types; if this is ever pinned lower, change
          # the script too.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Was a no-op before #73: no eslint dep and no config, so it dropped into
      # Next's interactive setup prompt and could never have run here.
      - run: npm run lint
      - run: npm test
      # `npm run dev` can't bundle the node: import in src/lib/zcash/t2z.ts,
      # so a real build is the only signal that the app actually ships.
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Real ZalletSender against the fake-zallet double (#68): the path under
      # test is production code, only the wallet RPC boundary is faked.
      FAUCET_SENDER: zallet
      ZALLET_RPC_URL: http://127.0.0.1:28299/
      ZALLET_ACCOUNT: fake-account
      ZALLET_ADDRESS: utest1fake
      ZALLET_MIN_CONF: "0"
      ZALLET_POLL_MS: "250"
      FAUCET_CHALLENGE: pow
      FAUCET_POW_BITS: "16"
      RATE_LIMIT_SALT: ci-smoke-not-a-secret
      PORT: "3100"
      SMOKE_URL: http://localhost:3100
      # Point the tip oracle at a local fixture, same as the ui and api-tests
      # jobs. This job was green WITHOUT it only because the claim went through
      # POST /api/faucet, which consulted nothing: the oracle reached the live
      # dashboard, our node read ~570,000 blocks behind the wallet double's tip
      # of 3,650,000, and nothing on the drip path cared. #187 makes the drip
      # path care, so the environment has to stop lying to it (#171).
      HOSH_URL: http://127.0.0.1:28324/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The real claim flow over HTTP: status, signed pow challenge, solve,
      # claim -> txid, repeat -> 429, no pow -> 403. Integration coverage the
      # unit tests cannot give, and the cutover validation script.
      - name: e2e smoke
        run: |
          PORT=28299 node scripts/fake-zallet.mjs &
          double=$!
          # Before the app, not after. The first background tip refresh happens at
          # boot, and if the fixture is missing then, the oracle degrades to a
          # direct lightwalletd call and caches the REAL network tip for the rest
          # of the run. Starting it late narrows the race instead of removing it.
          PORT=28324 node scripts/fake-hosh.mjs &
          hosh=$!
          # Declared before the trap so the hard exit below still reaps the doubles.
          server=""
          trap 'kill "$server" "$double" "$hosh" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf "$HOSH_URL" >/dev/null && break
            sleep 1
          done
          curl -sf "$HOSH_URL" >/dev/null || { echo "tip-oracle fixture never came up"; exit 1; }
          npm start &
          server=$!
          for _ in $(seq 1 60); do
            curl -sf "$SMOKE_URL/api/status" >/dev/null && break
            sleep 1
          done
          npm run smoke

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Same double-backed setup as the smoke job, see #68.
      FAUCET_SENDER: zallet
      ZALLET_RPC_URL: http://127.0.0.1:28299/
      ZALLET_ACCOUNT: fake-account
      ZALLET_ADDRESS: utest1fake
      ZALLET_MIN_CONF: "0"
      ZALLET_POLL_MS: "250"
      FAUCET_CHALLENGE: pow
      # Low bits so the in-page worker still runs but finishes fast.
      FAUCET_POW_BITS: "12"
      RATE_LIMIT_SALT: ci-ui-smoke-not-a-secret
      PORT: "3120"
      UI_SMOKE_URL: http://localhost:3120
      # Point the tip oracle at a local fixture instead of the live hosh
      # dashboard. Without this the app compares the wallet double's tip
      # (3,650,000) against the real network (past 4,220,000), decides our node is
      # ~570,000 blocks behind, marks it frozen and refuses the claim - so the
      # smoke test waits out its 120s timeout for a "Sent ✓" that can never
      # appear. Same root cause as the api-tests job (#171).
      HOSH_URL: http://127.0.0.1:28324/
      # cTAZ ON for this job, against the crosslink double (#326). Without it the
      # toggle does not render and ui-smoke reports its cTAZ checks as SKIPPED, which
      # is honest but covers nothing: the toggle, the no-txid receipt and the unknown
      # reserve would ship behind unit tests alone.
      FAUCET_CTAZ_ENABLED: "true"
      CROSSLINK_RPC_URL: http://127.0.0.1:28611/
      # EMPTY ON PURPOSE, and this line is why the job exists at all (#409).
      #
      # In production the app reaches the Crosslink node through a unix socket, because
      # the container has no route to its RPC. That default is right there and wrong
      # everywhere else: here the node is an HTTP double on 28611, no socket exists, and
      # ctazRpc deliberately does NOT fall back from a configured socket to HTTP - a
      # broken socket in production must not silently become a direct call.
      #
      # So without this, cTAZ never becomes servable in CI, the toggle renders unready and
      # every cTAZ assertion in ui-smoke fails. It did: the socket PR was red here and the
      # Actions outage hid it behind cancelled jobs long enough for me to call the whole
      # thing infrastructure. The empty value is the documented escape hatch for exactly
      # this case, a node that is directly reachable.
      FAUCET_CTAZ_RPC_SOCKET: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # --no-save on purpose: Playwright is a CI-only concern, so it stays out
      # of package.json and `npm ci` stays lean for everyone else.
      #
      # Pinned exactly, because unpinned it resolved to whatever shipped that
      # morning: a browser release could turn this job red with no diff to
      # explain it. Dependabot cannot see a version that lives outside a
      # manifest, so bumping this is a manual step, deliberately.
      - name: install playwright chromium
        env:
          PLAYWRIGHT_VERSION: 1.62.0
        run: |
          npm i --no-save "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      # Drives a claim in a real browser: the page, the pow worker, the success
      # card and the copy path. Guarded so refs predating the script stay green.
      - name: browser smoke
        run: |
          if [ ! -f scripts/ui-smoke.mjs ]; then
            echo "no scripts/ui-smoke.mjs on this ref, skipping"
            exit 0
          fi
          PORT=28299 node scripts/fake-zallet.mjs &
          double=$!
          # The oracle fixture must be answering BEFORE the app starts. If the
          # app's first background tip refresh finds it missing, the oracle falls
          # back to a direct lightwalletd call, caches the real network tip, and
          # the run is frozen from then on - starting it late only narrows the race
          # rather than removing it.
          PORT=28324 node scripts/fake-hosh.mjs &
          hosh=$!
          # The cTAZ node double. Unlike the other two this one is not load-bearing for
          # the TAZ flow: if it never comes up the app reports cTAZ as cannot-verify and
          # ui-smoke says its cTAZ checks were skipped, so the job stays honest rather
          # than going red for an unrelated reason. The readiness wait below is what
          # turns "did not come up" into a visible skip instead of a silent one.
          PORT=28611 node scripts/fake-crosslink.mjs &
          crosslink=$!
          # Declared before the trap so the early exit below still reaps the
          # doubles rather than leaking them on a failure path.
          server=""
          trap 'kill "$server" "$double" "$hosh" "$crosslink" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf "$HOSH_URL" >/dev/null && break
            sleep 1
          done
          curl -sf "$HOSH_URL" >/dev/null || { echo "tip-oracle fixture never came up"; exit 1; }
          npm start &
          server=$!
          for _ in $(seq 1 60); do
            curl -sf "$UI_SMOKE_URL/api/status" >/dev/null && break
            sleep 1
          done
          # Say out loud whether cTAZ came up, BEFORE the smoke runs. ui-smoke skips its
          # cTAZ checks when the flag is off, and a skip buried in 30 lines of "ok" is
          # exactly the sort of thing that goes unread for a month.
          if curl -sf "$UI_SMOKE_URL/api/status" | grep -q '"ctaz":{"enabled":true'; then
            echo "cTAZ is up, the toggle checks will run"
          else
            echo "::warning::cTAZ did not come up, so the #326 toggle checks will be SKIPPED in this run"
          fi
          node scripts/ui-smoke.mjs

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Route-level integration suite (scripts/api-integration.mjs): boots the
      # built app in two configs and drives every API route. Guarded so refs
      # that predate the suite stay green.
      - name: api integration tests
        run: |
          if [ -f scripts/api-integration.mjs ]; then
            npm run test:api
          else
            echo "no scripts/api-integration.mjs on this ref, skipping"
          fi

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # High or critical advisories fail the build. Lows are visible in the
      # log but do not gate: for a hot-wallet faucet the bar is no known-bad
      # crypto or parser in the tree, not zero noise.
      - name: npm audit (fail on high)
        run: |
          npm audit || true
          npm audit --audit-level=high >/dev/null
      - name: cargo audit (fail on any advisory)
        run: |
          if [ -d deploy/z3/miner ]; then
            cargo install cargo-audit --locked
            cargo audit --file deploy/z3/miner/Cargo.lock
          else
            echo "no deploy/z3/miner on this ref, skipping"
          fi

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck every tracked shell script
        # NOT A GLOB, AND THAT IS THE WHOLE POINT. `deploy/z3/*.sh` matched 22 of the 41
        # tracked .sh files in this repo and silently excluded 19: the entire test harness,
        # run-tests.sh, lib.sh, all sixteen suites, and scripts/worktree-deps.sh.
        #
        # Sixteen of the excluded files open with `# shellcheck shell=bash`, a directive
        # that only means anything to a linter that is looking at them, written by people
        # who reasonably assumed they were being checked. They were not, since the day the
        # harness landed.
        #
        # The harness is what caught the $HERE bug in redeploy.sh that shellcheck cannot
        # see at any severity, so the least-linted code in this tree was the code the gate
        # depends on. A glob cannot report what it failed to match, so from inside CI this
        # step was green and it was green about 22 files.
        #
        # Enumerating from git means a new script is covered by this existing, rather than
        # by somebody remembering to widen a pattern.
        #
        # THE FLOOR IS PART OF THE CHECK. `xargs` on an empty list runs shellcheck with no
        # arguments at all, so a checkout that produced no files would otherwise sail
        # through as a pass having linted nothing. Do not add --no-run-if-empty.
        run: |
          n=$(git ls-files '*.sh' | wc -l | tr -d ' ')
          echo "shellchecking $n tracked shell scripts"
          [ "$n" -ge 30 ] || { echo "only $n tracked .sh found; that is a broken checkout, not a clean repo"; exit 1; }
          git ls-files -z '*.sh' | xargs -0 shellcheck -S warning
      - name: z3 test harness
        # run-tests.sh is the single entrypoint and runs every suite under
        # deploy/z3/tests/suites/ with one tally. Never glob the tests dir:
        # stubs/ and deploy-stubs/ hold fake zebrad/docker binaries the
        # suites put on PATH, not test files. Guarded so refs that predate
        # the harness stay green.
        run: |
          if [ -f deploy/z3/tests/run-tests.sh ]; then
            bash deploy/z3/tests/run-tests.sh
          else
            echo "no deploy/z3/tests/run-tests.sh on this ref, skipping"
          fi
      - name: cloud-init parses
        run: python3 -c 'import yaml; yaml.safe_load(open("deploy/cloud-init.yaml"))'

  miner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Guarded the same way as the harness suites: green before the miner
      # lands, active the moment it merges. Plain `cargo test` only, the
      # ignored solve test needs a release build and ~144MB, it stays a
      # local-run check (see MINING.md).
      - name: cargo test + clippy
        run: |
          if [ -d deploy/z3/miner ]; then
            cd deploy/z3/miner
            cargo test
            cargo clippy --all-targets -- -D warnings
          else
            echo "no deploy/z3/miner on this ref, skipping"
          fi

  # THE IMAGE IS BUILT IN CI BECAUSE, UNTIL NOW, IT WAS ONLY EVER BUILT ON THE BOX (#374).
  #
  # Every other job here runs `npm ci` on the runner, which proves the dependency tree
  # installs. None of them proved the IMAGE builds. Those differ: the Dockerfile installs
  # build tooling for better-sqlite3, runs `npm run build` inside node:24-slim, and copies
  # a context filtered by .dockerignore. A dependency that breaks any of that was
  # discovered when redeploy failed on the box, in production, after the merge.
  #
  # WHAT A GREEN RUN HERE DOES NOT MEAN, and this is load-bearing rather than a caveat.
  # A CI runner starts with an EMPTY layer cache. The box does not. #377 was exactly that
  # divergence: a stale cached COPY layer on the box shipped secrets that the committed
  # .dockerignore excluded, and a CI build of that same commit would have produced a
  # correct image and passed. So this job answers "would this COMMIT build a correct image
  # on a clean cache" and it CANNOT answer "is the image on the box correct". The second
  # question belongs to redeploy's post-condition and nothing here substitutes for it.
  # Anyone citing this job as evidence about the box is making the #377 mistake again.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v7 like every other job here. v4 was an inconsistency, and CI version skew is
      # what later produces works-in-one-job-not-the-other with no diff to explain it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No cache, no buildx layer reuse. A cold build is the whole point: it is the only
      # way this job can tell us the commit stands on its own.
      - name: build the app image
        run: docker build --no-cache --progress=plain -t faucet-ci-check:${{ github.sha }} .

      # THE IGNORE FILE, CHECKED WITH DOCKER'S OWN MATCHER. The step below looks for
      # secrets in the built image, but CI builds from a clean checkout where no backup
      # file exists, so it can only ever prove the rules against names that are present.
      # The box is where backups accumulate, and the box is where the image is built.
      # So this builds a throwaway context holding every spelling a secrets file has ever
      # taken here - and the ones it has not yet - and asserts .dockerignore lets through
      # exactly the example and nothing else. fnmatch is NOT used: it disagreed with
      # docker on this very file family and gave a confident wrong answer.
      - name: .dockerignore excludes every spelling of the secrets file
        run: |
          set -euo pipefail
          ctx="$(mktemp -d)"
          mkdir -p "$ctx/deploy/z3"
          cp .dockerignore "$ctx/"
          # Real spellings from the box, plus shapes nobody has used yet. '#faucet.env#' is
          # emacs's autosave: present from the first keystroke to the save.
          for f in faucet.env faucet.env.example \
                   faucet.env.bak-20260730T173852Z faucet.env.pre-acct-restore-20260731T080219Z \
                   faucet.env.bak.1789032981 faucet.env.orig faucet.env.tmp.4242 faucet.env~ '#faucet.env#' \
                   alerts.env watchdog.env miner.env .env .env.tmp.99; do
            echo "secret=$f" > "$ctx/deploy/z3/$f"
          done
          echo "secret=root" > "$ctx/.env"
          # THE OTHER FAMILY (risk register II, R-5): the sidecars deploy.sh writes and the
          # trees it clones or builds, none of which are env-shaped and all of which the
          # first version of this probe let through.
          echo "rpc-password" > "$ctx/deploy/.zallet-rpc-password"
          echo "account-uuid" > "$ctx/deploy/.faucet-account"
          mkdir -p "$ctx/deploy/z3-stack/config/testnet" "$ctx/deploy/z3/miner/target/release" "$ctx/deploy/z3/.git"
          echo "pwhash=..." > "$ctx/deploy/z3-stack/config/testnet/zallet.toml"
          echo "binary" > "$ctx/deploy/z3/miner/target/release/zcash-testnet-miner"
          echo "x" > "$ctx/deploy/z3/.some-dotfile"
          # THE R-10 EXCLUSIONS, one planted file each (#545 review): the ops scripts, the
          # local doubles, the docs, the design sources, the workflows, the team notes and
          # every test spelling. A grep for the six .dockerignore lines proved nothing
          # about matching (#369); a trailing !scripts/** would have kept it green.
          mkdir -p "$ctx/scripts" "$ctx/docs" "$ctx/design" "$ctx/.github/workflows" "$ctx/.team" "$ctx/src/lib"
          echo "double" > "$ctx/scripts/fake-zallet.mjs"
          echo "doc" > "$ctx/docs/OPERATIONS.md"
          echo "html" > "$ctx/design/faucet-architecture.html"
          echo "yaml" > "$ctx/.github/workflows/ci.yml"
          echo "notes" > "$ctx/.team/board.md"
          echo "test" > "$ctx/src/lib/pow.test.ts"
          echo "test" > "$ctx/src/lib/page.test.tsx"
          echo "test" > "$ctx/scripts/probe.test.mjs"
          printf 'FROM busybox\nCOPY . /ctx\nRUN find /ctx -type f | sort > /ctx.list\n' > "$ctx/Dockerfile"
          docker build -q -t dockerignore-probe "$ctx" >/dev/null
          got="$(docker run --rm --entrypoint sh dockerignore-probe -c 'grep -vE "^/ctx/(Dockerfile|\.dockerignore)$" /ctx.list' || true)"
          docker rmi -f dockerignore-probe >/dev/null 2>&1 || true
          rm -rf "$ctx"
          want="/ctx/deploy/z3/faucet.env.example"
          if [ -z "$got" ]; then
            # The opposite failure, and the message has to point the opposite way: the
            # example is documentation the README links to, and losing it means the
            # negation was deleted or is no longer the LAST matching rule.
            echo "THE BUILD CONTEXT EXCLUDED THE EXAMPLE TOO."
            echo "!**/faucet.env.example must be present and must be the last rule that matches it."
            exit 1
          fi
          if [ "$got" != "$want" ]; then
            echo "THE BUILD CONTEXT LET THESE THROUGH (only the example is allowed):"
            printf '%s\n' "$got" | sed 's/^/  /'
            echo
            echo "Each is a secrets-file spelling or an R-10 exclusion (scripts, docs, design, .github,"
            echo ".team, *.test.*). Add the missing rule to .dockerignore ABOVE the !**/faucet.env.example"
            echo "negation, and check nothing after it negates the rule back."
            exit 1
          fi
          echo "context admits only $want"

      # The cheap half of #377's contract, run where it is free. An absence check only
      # catches what someone listed, so it is not the whole answer, but a secret reaching
      # a layer is the failure with the longest tail and it costs one command to refuse.
      - name: no secret-shaped file may enter the image
        run: |
          set -uo pipefail
          # ALLOWED BY NAME, NOT BY LUCK. deploy/z3/stack-versions.env is a tracked config
          # file recording which node and wallet images the deploy runs (#247) and it
          # matches *.env. Today it never reaches the image because .dockerignore's
          # **/*.env excludes it, so this check passed for a reason nobody had written
          # down: an ignore rule aggressive enough to hide a file that is not a secret.
          # The day someone needs it in the image, this job fails and the tempting fix is
          # loosening the secret pattern, which is the wrong direction. Naming the
          # exceptions here keeps the pattern strict and the exception reviewable.
          found="$(docker run --rm --entrypoint sh faucet-ci-check:${{ github.sha }} -c '
            find /app -name "*.env" -o -name "*.env.*" \
                 -o -name "*.pem" -o -name "*.key" \
                 -o -name ".zallet-rpc-password" -o -name ".faucet-account" \
                 -o -path "/app/deploy/z3-stack/*" -o -path "/app/deploy/z3/miner/target/*" 2>/dev/null |
            grep -vE "\.env\.example$|/stack-versions\.env$" || true' )"
          if [ -n "$found" ]; then
            echo "SECRET-SHAPED FILES REACHED THE IMAGE:"
            printf '%s\n' "$found" | sed 's/^/  /'
            echo
            echo "The committed .dockerignore did not exclude these. Note Docker's * does"
            echo "not cross a /, so a root-level pattern never matches deploy/z3/foo.env."
            exit 1
          fi
          echo "no secret-shaped files in the image"

      # THE VERIFIER, AGAINST THE IMAGE IT JUST BUILT (risk register II, R-5 review). The
      # harness proves the verifier's logic on fixtures; twice in one PR a fixture set that
      # was green shipped a verifier that failed every real build (a matcher that let `*`
      # cross `/`, then a comment rule that turned one pattern into "match everything").
      # This is the run redeploy.sh does on the box, done here first. Exit 1 is a real
      # mismatch; exit 2 (cannot compare) is also a failure HERE, since this runner can
      # always read its own image.
      - name: the image matches the commit, by the same verifier the box runs
        run: |
          set -uo pipefail
          VERIFY_REPO_DIR="$GITHUB_WORKSPACE" bash deploy/z3/verify-image-manifest.sh faucet-ci-check:${{ github.sha }}
          rc=$?
          [ "$rc" -eq 0 ] || { echo "verify-image-manifest exited $rc against the image this job built"; exit 1; }

      # A build that produces nothing runnable is a build that proved nothing.
      - name: the image actually starts
        run: |
          set -uo pipefail
          out="$(docker run --rm --entrypoint node faucet-ci-check:${{ github.sha }} -e 'console.log("node-ok")' 2>&1)" || {
            echo "the built image could not run node:"; printf '%s\n' "$out"; exit 1; }
          [ "$out" = "node-ok" ] || { echo "unexpected: $out"; exit 1; }
          echo "image runs"

      # THE IMAGE SCANNER (risk register II, R-42). Every dependency ecosystem here has a
      # gate except the runtime image itself: node:24-slim is digest-pinned (R-7), which
      # means a CVE in its Debian layer stays until someone bumps the digest, and nothing
      # said when that was due. Trivy reads the OS packages and the app's node_modules in
      # the image this job built. CRITICAL only, and only where a fix exists: an
      # unfixable finding is a fact to know, not a red to chase, and HIGH on a slim base
      # would page on Debian's backlog. Pinned to a commit like every other action (R-8).
      - name: no fixable CRITICAL vulnerability in the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: faucet-ci-check:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # AND IT RUNS AS NOBODY MUCH (risk register II, R-10): through its own entrypoint,
      # under the compose file's flags, the process is uid 1000 with no effective
      # capability and no way to gain one (no-new-privileges) on a read-only root, and it
      # can still open the ledger volume even when the volume arrived root-owned, which
      # is what every existing box has. The read-only probe touches a path node OWNS
      # (/home/node): touching /app proved nothing, since root-owned 0755 refuses uid 1000
      # with or without the flag (review of #545).
      # Every run flag comes from the committed compose file, resolved by compose itself
      # (the x-common anchor merge included), never typed here: a probe that passes
      # --read-only and --cap-drop ALL on its own command line and then asserts rootfs-ro
      # and caps=0 can never go red for a change to this repo (#545 review). Deleting
      # security_opt from the anchor now turns nnp=0 and fails the job. And the capability
      # line to read is CapBnd, not CapEff: setpriv clears the effective set on its own
      # when it drops uid, so CapEff=0 is true of any drop-privileges entrypoint whether or
      # not cap_drop is in the compose file. The bounding set is what carries cap_drop and
      # cap_add: 0xc9 is exactly CHOWN, FOWNER, SETGID, SETUID and nothing else.
      - name: under the flags the compose file declares, the image drops root, bounds itself to the four capabilities, and can still write its ledger and its tmpfs
        run: |
          set -uo pipefail
          : > deploy/z3/faucet.env   # env_file is required; an empty one resolves the config
          flags="$(docker compose -f deploy/z3/docker-compose.faucet.yml config --format json | python3 -c '
          import json, sys
          s = json.load(sys.stdin)["services"]["faucet"]
          # Keys that would override the flags below without changing them: privileged
          # resets the bounding set to everything, pid/ipc/network_mode/devices/userns
          # hand over host namespaces or nodes, an extra mount is an extra reach, and a
          # compose entrypoint/command/user replaces the root-dropping entrypoint the image
          # ships while this probe (which runs through that entrypoint) would still read
          # uid=1000. Any of them present is a failure here, whatever the probe measures.
          # (No apostrophes in this block: it is inside the single quotes of python -c.)
          for k in ("privileged", "pid", "ipc", "network_mode", "devices", "userns_mode", "cgroup", "sysctls", "device_cgroup_rules", "ports", "entrypoint", "command", "user"):
              if s.get(k): sys.exit("compose service sets %s" % k)
          if sorted(s.get("cap_add") or []) != ["CHOWN", "FOWNER", "SETGID", "SETUID"]: sys.exit("cap_add is not the four")
          mounts = sorted((v["source"], v["target"], bool(v.get("read_only"))) for v in s.get("volumes") or [])
          if mounts != [("/var/lib/faucet-miner", "/var/lib/faucet-miner", True), ("faucet_data", "/app/data", False)]: sys.exit("volumes are not the ledger and the read-only heartbeat: %r" % mounts)
          if any("unconfined" in o for o in s.get("security_opt") or []): sys.exit("security_opt disables a profile")
          a = ["--read-only"] if s.get("read_only") else []
          for t in s.get("tmpfs") or []: a += ["--tmpfs", t]
          for c in s.get("cap_drop") or []: a += ["--cap-drop", c]
          for c in s.get("cap_add") or []: a += ["--cap-add", c]
          for o in s.get("security_opt") or []: a += ["--security-opt", o]
          print(" ".join(a))')" || { rm -f deploy/z3/faucet.env; echo "the compose service is not the one SECURITY.md describes (see the line above)"; exit 1; }
          rm -f deploy/z3/faucet.env
          [ -n "$flags" ] || { echo "could not resolve the faucet service from the compose file"; exit 1; }
          echo "compose says: $flags"
          docker volume create r10 >/dev/null
          docker run --rm -v r10:/app/data --entrypoint sh faucet-ci-check:${{ github.sha }} -c 'touch /app/data/faucet.db && chown 0:0 /app/data/faucet.db'
          out="$(docker run --rm $flags -v r10:/app/data faucet-ci-check:${{ github.sha }} sh -c 'echo "uid=$(id -u) caps=$(grep ^CapEff /proc/self/status | cut -f2) bnd=$(grep ^CapBnd /proc/self/status | cut -f2) nnp=$(grep ^NoNewPrivs /proc/self/status | cut -f2) owner=$(stat -c %u /app/data/faucet.db)"; touch /app/data/w && echo write-ok; touch /tmp/w /app/.next/cache/w && echo tmpfs-ok; touch /home/node/probe 2>/dev/null && echo ROOTFS-WRITABLE || echo rootfs-ro')"
          docker volume rm r10 >/dev/null
          printf '%s\n' "$out"
          [ "$out" = "$(printf 'uid=1000 caps=0000000000000000 bnd=00000000000000c9 nnp=1 owner=1000\nwrite-ok\ntmpfs-ok\nrootfs-ro')" ] || { echo "the runtime is not the one the compose file promises"; exit 1; }
