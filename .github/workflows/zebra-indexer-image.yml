# Zebra 7.0.0 built with the `indexer` feature, published for the box.
#
# Zallet 0.1.0-beta.4 dropped its zaino backend; the zebra backend that replaces it reads
# zebrad's state database directly, and zebrad only writes the data it needs when built with
# `indexer`. Zebra's published images do not include it, and a zebrad without it still lets
# zallet start against an empty chain (zebra.zfnd.org/user/zallet.html, "Known issues").
#
# Built here rather than on the box: a Rust release build would fight the miner for the
# box's 7 GB of RAM for most of an hour.
name: zebra-indexer-image

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/zebra-indexer-image.yml"]

permissions:
  contents: read
  packages: write

env:
  ZEBRA_REF: v7.0.0
  IMAGE: ghcr.io/jinolabs-xyz/zebra-indexer

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      # A zebrad release build overruns the runner's default free disk.
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/checkout@v4
        with:
          repository: ZcashFoundation/zebra
          ref: ${{ env.ZEBRA_REF }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          build-args: FEATURES=default-release-binaries indexer
          push: true
          tags: ${{ env.IMAGE }}:${{ env.ZEBRA_REF }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.ZEBRA_REF }}-indexer

      # The digest is what the box pins; a tag can be pushed over.
      - name: digest
        run: echo "${{ env.IMAGE }}:${{ env.ZEBRA_REF }}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
