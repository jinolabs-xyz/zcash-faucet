# External monitoring of the live faucet: probes the public /api/status and
# /api/ready from a runner on a schedule (the cron asks for every 15 minutes and
# GitHub delivers rather less; see the measurement below). The on-box watchdog cannot report
# a dead box or broken DNS/TLS, an outside probe can. Read-only, never claims,
# so it drains nothing and burns no cooldown slots.
#
# Setup: set the repository variable FAUCET_LIVE_URL (Settings -> Secrets and
# variables -> Actions -> Variables) to the public origin, e.g.
# https://faucet.example.org. WITHOUT IT THIS WORKFLOW FAILS, on purpose: it used
# to skip green, so a repository with no URL had a monitoring workflow that passed
# on every run having probed nothing, which is the shape of every false pass in
# this tree (risk register #17). To turn the monitoring off deliberately, set the
# variable FAUCET_LIVE_SMOKE_DISABLED=1 and it says so and exits 0, whether or not
# the URL is set. THAT ONE HAS NO EXPIRY, and it is the last switch here that does not:
# it silences all off-box monitoring on a green check, and nothing on the box can see a
# GitHub repository variable, so there is no second signal. It stays a deliberate,
# named, human action rather than a date because turning monitoring off for a planned
# window is not the same act as suppressing one failing check; if it is ever set and
# forgotten, this comment is the only thing that will say so.
#
# TWO MORE WAYS THIS CAN GO QUIET, both of them outside the run:
#   - GitHub disables scheduled workflows after 60 days with no repository activity.
#     Nothing here can detect that (nothing runs), so the page step reports the real
#     gap since the previous scheduled run and says when the schedule is not keeping
#     to its cron.
#   - The cron is best-effort. Measured on this repository 2026-09-09: a "*/15"
#     schedule actually fired about every five hours. So "two consecutive failures"
#     is NOT 30 minutes of downtime, and the page below reads the clock instead of
#     counting runs.
# A red run means the faucet is unreachable or says it cannot drip, and the log
# carries the app's own reason.
name: live-smoke

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # the page step reads the previous run's conclusion for the 30-minute rule

jobs:
  probe:
    runs-on: ubuntu-latest
    # The outer layer, same reason as every job in ci.yml. The probe STEP carries its own
    # budget below, and that one matters more here: a job that hits this budget concludes
    # CANCELLED, not failed, and a cancelled run neither runs a `failure()` step nor counts
    # as a failure when the next run asks what the previous one did (#503). So a probe
    # that hung would have been cut off silently, every run, and never paged. A step
    # that hits its budget FAILS, which is the shape the paging below understands.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches the Dockerfile (node:24-slim), like every job in ci.yml. #257
          # moved those five pins off 23 and missed this one, so the workflow that
          # probes the LIVE faucet was the last place still testing on a runtime
          # production does not have. The repo suite now asserts this rather than
          # leaving it to whoever remembers.
          node-version: 24
      # No npm ci: the probe has zero dependencies, checkout is enough.
      - name: probe the live faucet
        id: probe
        # The probe bounds itself: SMOKE_ATTEMPTS x SMOKE_TIMEOUT_MS x two fetches plus
        # retry delays, the TLS handshake and the explorer checks come to ~3.5 minutes
        # at the defaults. Three times that, so a hung probe is a FAILED step with the
        # page step still to run, rather than a cancelled job with nothing after it.
        timeout-minutes: 10
        env:
          SMOKE_URL: ${{ vars.FAUCET_LIVE_URL }}
          SMOKE_ALLOW_UNREADY: ${{ vars.FAUCET_LIVE_ALLOW_UNREADY }}
          SMOKE_DISABLED: ${{ vars.FAUCET_LIVE_SMOKE_DISABLED }}
        run: |
          # The off switch is checked FIRST, so it works during a maintenance window with
          # the URL still set. Inside the URL test it only answered when the URL was
          # already missing, which is the one case that needs no switch.
          if [ "$SMOKE_DISABLED" = "1" ]; then
            echo "FAUCET_LIVE_SMOKE_DISABLED=1: off-box monitoring is deliberately off"
            exit 0
          fi
          if [ -z "$SMOKE_URL" ]; then
            echo "FAUCET_LIVE_URL is not set, so this workflow has been passing on every run having probed NOTHING." >&2
            echo "Set the repository variable to the public origin, or set FAUCET_LIVE_SMOKE_DISABLED=1 to turn monitoring off on purpose." >&2
            exit 1
          fi
          # AND IT HAS TO BE https. Caddy 308s :80 to :443 and fetch follows redirects, so
          # an http:// origin is a fully green run with the certificate check silently
          # skipped - off-box TLS monitoring absent for ever behind a passing check, from
          # one mistyped variable (risk register #18).
          # Folded AND trimmed, and `https:` with no slashes counts: `new URL()` accepts
          # all three, and refusing one trips the paging step below for a variable that
          # would have worked.
          smoke_scheme="$(printf '%s' "$SMOKE_URL" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          case "$smoke_scheme" in
            # `https:/host` too: one dropped slash, which `new URL()` normalises and the
            # probe runs clean on, so refusing it pages a human for a variable that works.
            https://*|https:[!/]*|https:/[!/]*) ;;
            *) echo "FAUCET_LIVE_URL is '$SMOKE_URL', which is not https, so the certificate check would be skipped on every run." >&2
               echo "Point it at the https origin. The faucet checks would still pass through the redirect, which is exactly why this refuses." >&2
               exit 1 ;;
          esac
          node scripts/live-probe.mjs
      # PAGE A HUMAN, AND ONLY ON A REAL OUTAGE. The on-box watchdog pages after 30
      # minutes of not-ready, but it cannot page when the box itself is dead, so this is
      # the off-box backstop. The rule is 30 minutes of WALL CLOCK covered by consecutive
      # failures, read from the previous scheduled run's timestamp: counting runs assumed
      # a 15-minute cron this repository does not get (measured: about five hours between
      # scheduled runs), which made "two failures" mean ten hours, not thirty minutes.
      # A single red run already emails and is often a blip the probe's own retry did not
      # quite cover. If the previous run cannot be read, page anyway: under-alerting is
      # the failure this exists to fix.
      #
      # Setup: repository secret FAUCET_ALERT_URL (a Slack or Discord webhook) and,
      # for Discord, the repository variable FAUCET_ALERT_FORMAT=discord. Without the
      # secret this step says so and exits 0, so email stays the only channel.
      - name: page on the second consecutive failure (30 minutes down)
        # `cancelled()` too: with the step budget above a hung probe fails rather than
        # cancels, so this branch is for the job budget or a person cancelling the run.
        # Both still evaluate the 30-minute rule; a person who wants silence has the
        # FAUCET_LIVE_SMOKE_DISABLED switch, and the message says the probe was cut off
        # rather than claiming a failure it did not observe.
        if: failure() || cancelled()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          ALERT_URL: ${{ secrets.FAUCET_ALERT_URL }}
          ALERT_FORMAT: ${{ vars.FAUCET_ALERT_FORMAT }}
          GH_TOKEN: ${{ github.token }}
          SMOKE_URL: ${{ vars.FAUCET_LIVE_URL }}
        run: |
          if [ -z "$ALERT_URL" ]; then
            echo "FAUCET_ALERT_URL secret is not set, cannot page (email only)"
            exit 0
          fi
          # A run that SUCCEEDED or FAILED, nothing else. A sibling scheduled run queued a
          # minute ago has a null conclusion and a fresh timestamp, and taking it as "the
          # previous run" made the gap look like one minute and suppressed the page. So does
          # a run an operator CANCELLED mid-incident, which --status completed still returns
          # (GitHub conflates status and conclusion in that parameter), so the filter is on
          # the conclusion itself.
          prev_json="$(gh run list --workflow live-smoke --event schedule --limit 10 \
                    --json conclusion,databaseId,createdAt \
                    --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select(.conclusion == \"success\" or .conclusion == \"failure\")][0]" 2>/dev/null || echo '')"
          prev="$(printf '%s' "$prev_json" | jq -r '.conclusion // "unknown"' 2>/dev/null || echo unknown)"
          prev_at="$(printf '%s' "$prev_json" | jq -r '.createdAt // empty' 2>/dev/null || true)"
          gap_min=0
          prev_epoch=""
          [ -n "$prev_at" ] && prev_epoch="$(date -u -d "$prev_at" +%s 2>/dev/null || true)"
          if [ -n "$prev_epoch" ]; then
            gap_min=$(( ( $(date -u +%s) - prev_epoch ) / 60 ))
            echo "previous scheduled run: $prev, started ${gap_min} minutes ago"
            # The cron is best-effort and GitHub disables it entirely after 60 days of
            # repository inactivity. A gap far past the nominal 15 minutes is worth
            # saying out loud, because nothing else can: when the schedule stops, no run
            # exists to notice.
            [ "$gap_min" -gt 45 ] && echo "NOTE: the schedule is running every ${gap_min} minutes, not the 15 the cron asks for"
          else
            echo "previous scheduled run: $prev (no readable timestamp: ${prev_at:-none}; treating as a page)"
          fi
          if [ "$prev" = "success" ]; then
            echo "first failure: not paging yet, the next scheduled run decides once 30 minutes are covered"
            exit 0
          fi
          if [ -n "$prev_epoch" ] && [ "$gap_min" -lt 30 ]; then
            echo "two failures, but only ${gap_min} minutes apart: under the 30-minute rule, not paging yet"
            exit 0
          fi
          case "$PROBE_OUTCOME" in
            failure) what="has failed consecutive probes" ;;
            *)       what="was not probed to a verdict (probe step outcome: ${PROBE_OUTCOME:-unknown}) after a failure" ;;
          esac
          msg="[zcash-faucet live-smoke] the faucet $what spanning ${gap_min}+ minutes: $SMOKE_URL - $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          case "$ALERT_FORMAT" in
            discord) body="{\"content\":\"$msg\"}" ;;
            *)       body="{\"text\":\"$msg\"}" ;;
          esac
          if curl -fsS --max-time 15 -H 'content-type: application/json' -d "$body" "$ALERT_URL" >/dev/null; then
            echo "paged"
          else
            echo "webhook POST failed, the email notification is the only signal this time"
          fi
