# Advisories arrived by luck before this (#85). The audit job is the safety net:
# it fails on any high npm advisory and any RustSec advisory, so a bump that
# matters shows up as a red gate rather than as a quiet risk.
#
# Weekly, not daily: five ecosystems on a small team is a review load, and for npm and
# cargo the audit gate catches the urgent case between runs. The two image ecosystems
# have no such net - CI runs no image scanner - which is said again beside them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Patch and minor arrive grouped so the queue is one review, not twenty.
    # Majors stay separate because they need a person to read a changelog.
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /deploy/z3/miner
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  # THE BASE IMAGES THIS REPO DECLARES, which were the one supply chain nobody watched.
  # npm, cargo and the actions were covered; the images the app is BUILT and SERVED from -
  # node:24-slim under the app, caddy:2 terminating TLS - were not, so a CVE in either
  # arrived only if someone happened to read a release note. Same "no signal, only luck"
  # shape as #85 (risk register #26).
  #
  # SCOPED TO WHAT THIS REPO DECLARES, and the wording matters. The box also runs
  # zfnd/zebra and zodlinc/zallet, pinned in deploy/z3/stack-versions.env - a shell env
  # file no dependabot ecosystem parses, so those two are updated by hand and always will
  # be under this tool. Claiming "every image this box runs" would be false, and a false
  # claim here is worse than none: it is what stops the next person checking. The repo
  # suite pins that exception list at exactly those two.
  #
  # AND THERE IS NO SAFETY NET HERE. The audit gate covers npm and cargo advisories; CI
  # runs no image scanner at all, so unlike the other three ecosystems there is nothing
  # catching the urgent case between weekly runs. That makes it matter more, not less,
  # that these entries actually work.
  #
  # TWO ECOSYSTEMS, NOT ONE. `docker` reads Dockerfiles (and Kubernetes manifests); Compose
  # files need `docker-compose`, which is a separate ecosystem name. Pointing `docker` at a
  # directory whose only image lives in a compose file parses nothing and opens no pull
  # request, ever, with no error anywhere - which is how the first version of this entry
  # left caddy exactly as unwatched as before. Neither recurses, so it is one entry per
  # directory, and the repo suite asserts every directory holding an image has an entry
  # OF THE RIGHT KIND.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # caddy:2 lives in the compose file, not a Dockerfile.
  - package-ecosystem: docker-compose
    directory: /deploy/z3
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      compose-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Built on the box by deploy.sh, not pulled: under this ecosystem the bare name
      # resolves to library/zcash-faucet, which does not exist, and the job would say so
      # every week for ever.
      - dependency-name: "zcash-faucet"

  # DELIBERATELY NOT WATCHED: deploy/z3/ctaz-build. dependabot does not resolve
  # `FROM ${RUST_IMAGE}` - its parser has no ARG handling, so that Dockerfile yields no
  # dependencies and an entry there would sit silent. Inlining the tag to fix that would
  # cost the caller override AND contradict the file's own note that the Rust version is
  # not pinned by that line at all (rust-toolchain.toml says `channel = "stable"` and
  # rustup honours it). Nothing from that image ships either: the artifact stage is FROM
  # scratch and copies one binary, so a CVE in the build image never reaches production.
