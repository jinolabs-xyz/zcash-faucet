<svg xmlns="http://www.w3.org/2000/svg" width="150" height="20" role="img" aria-label="network: testnet only">
  <!-- Committed rather than fetched from a badge service: no third-party host,
       nothing to rot, and it matches the product accent (#ec3013). Shape and
       type size follow GitHub's own badges so it sits level with the CI one. -->
  <rect width="150" height="20" fill="#201e1d"/>
  <rect x="61" width="89" height="20" fill="#ec3013"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f3f2f2">
    <text x="8" y="14">network</text>
    <text x="70" y="14">testnet only</text>
  </g>
</svg>
