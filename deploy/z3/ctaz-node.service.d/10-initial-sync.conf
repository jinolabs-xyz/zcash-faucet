# TEMPORARY. Remove this file once the node reaches their tip.
#
# Initial sync is CPU-bound and nothing else: measured at the unit's steady 100% quota the
# process sat at exactly 99.3% and moved 22 blocks/min, which against ~376k blocks is
# about twelve days. The box has 4 cores, the TAZ miner holds 1.5 and everything else
# ~0.25, so roughly 1.3 cores were sitting idle while the sync crawled.
#
# WHY THIS IS SAFE TO RAISE: the quota is not what protects the TAZ side. Nice=19 is.
# Under contention the scheduler hands the CPU to the TAZ miner (Nice=15) and the faucet
# (Nice=0) first, and cTAZ takes what is left. The quota's job is to bound the worst case,
# and 200% of four cores still leaves two.
#
# WHY IT IS NOT PERMANENT: after the sync this node starts mining, and a miner will use
# every bit of quota it is given, forever. At that point cTAZ mining would be competing
# with TAZ mining for the box, and TAZ is what funds the faucet people actually use.
#
# Removing this is step 2 of a two-step change and the steps are deliberately coupled, so
# neither can be forgotten alone (CTAZ.md, "Turning the miner on"):
#
#   1. set [mining] internal_miner = true in /etc/faucet/ctaz-zebrad.toml
#   2. rm /etc/systemd/system/ctaz-node.service.d/10-initial-sync.conf
#   3. systemctl daemon-reload && systemctl restart ctaz-node

[Service]
CPUQuota=200%
