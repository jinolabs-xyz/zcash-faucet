[package]
name = "zcash-testnet-miner"
version = "0.1.0"
edition = "2021"
description = "Solo CPU miner that funds the faucet by mining public Zcash testnet blocks"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# tromp's Equihash 200,9 solver behind the maintained Rust API. This is the
# same crate and entry point zebra's own internal miner uses, so we are not
# hand-rolling any proof of work.
equihash = { version = "0.3", features = ["solver"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = 3
codegen-units = 1
