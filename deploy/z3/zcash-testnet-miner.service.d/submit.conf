# The miner's live configuration, as the box has run it since 2026-07-28.
#
# It was a hand-made drop-in on the box and nothing in the repo, so a rebuild would have come
# back in `proposal` mode with no cookie path and mined nothing. The nightly audit reported it
# for eight weeks ("drop-in zcash-testnet-miner.service.d/submit.conf exists on the box and is
# not in the repo") and the live-smoke has been red on it since the drift word went public.
#
# submit, not proposal: the unit's own default is proposal and its comment says that stays until
# the first live block is coordinated. That happened long ago; the miner funds the faucet and the
# owner un-parked it on 2026-09-21. The box is the truth and the repo is catching up to it.
#
# The cookie is zebra's RPC cookie, read from the docker volume the node writes it to. Nothing
# here is a secret: a path, a mode and three timings.
[Service]
Environment=MINER_MODE=submit
Environment=MINER_COOKIE_PATH=/var/lib/docker/volumes/z3-testnet-cookie/_data/.cookie
Environment=MINER_THREADS=4
Environment=MINER_TEMPLATE_SECS=8
Environment=MINER_POLL_SECS=5
